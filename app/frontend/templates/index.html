<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart RAG PDF QA</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

<style>
/* SMART RAG MODERN DASHBOARD THEME */
:root {
    color-scheme: dark;
    --rag-bg: #0b1020;
    --rag-surface: #17223a;
    --rag-border: #334155;
    --rag-text: #f1f5f9;
    --rag-muted: #94a3b8;
    --rag-primary: #6366f1;
    --rag-accent: #22d3ee;
}

body.bg-light {
    background:
        radial-gradient(circle at 15% 5%, #27346a 0%, transparent 34%),
        radial-gradient(circle at 85% 20%, #123a53 0%, transparent 30%),
        var(--rag-bg) !important;
    color: var(--rag-text);
    min-height: 100vh;
}

main.container {
    max-width: 1160px;
}

main .col-lg-8 {
    width: 100%;
    max-width: 1040px;
}

main .card {
    background: rgba(23, 34, 58, 0.92);
    border: 1px solid var(--rag-border);
    border-radius: 22px;
    color: var(--rag-text);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3) !important;
    animation: ragFadeIn 0.5s ease-out both;
}

main h1 {
    font-weight: 750;
    letter-spacing: -0.6px;
}

main h2 {
    color: #e0e7ff;
    font-weight: 650;
}

main .text-muted,
main .form-text {
    color: var(--rag-muted) !important;
}

main .form-label {
    color: #cbd5e1;
    font-weight: 500;
}

main hr {
    border-color: #475569;
    opacity: 0.55;
}

main .form-control,
main .form-select {
    background-color: #101a2e;
    border: 1px solid #475569;
    border-radius: 11px;
    color: var(--rag-text);
    padding: 12px 14px;
}

main .form-control:focus,
main .form-select:focus {
    background-color: #111e35;
    color: white;
    border-color: #818cf8;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
}

main .form-control::placeholder {
    color: #94a3b8;
}

main .form-control:disabled,
main .form-select:disabled {
    background-color: #1e293b;
    color: #94a3b8;
    opacity: 0.8;
}

main input[type="file"]::file-selector-button {
    background: #293958;
    color: #e0e7ff;
    border: 0;
    padding: 12px 18px;
    margin: -12px 14px -12px -14px;
    cursor: pointer;
}

main .btn {
    border: 0;
    border-radius: 11px;
    padding: 11px 22px;
    font-weight: 600;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

main .btn-primary {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
}

main .btn-success {
    background: linear-gradient(135deg, #0891b2, #4f46e5);
}

main .btn:not(:disabled):hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
}

main .alert {
    border-radius: 12px;
    overflow-wrap: anywhere;
}

#selectedFileName,
#documentStatus {
    overflow-wrap: anywhere;
}

@keyframes ragFadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
    main .card {
        animation: none;
    }
    main .btn {
        transition: none;
    }
    main .btn:not(:disabled):hover {
        transform: none;
    }
}

@media (max-width: 576px) {
    main.container {
        padding: 14px !important;
    }
    main .card-body {
        padding: 20px !important;
    }
}

/* SMART RAG DASHBOARD GRID V2 */
main .card-body {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
}

main .card-body > h1,
main .card-body > p.text-muted {
    grid-column: 1 / -1;
}

main .card-body > h1 {
    margin-bottom: 0 !important;
}

main .card-body > p.text-muted {
    margin-bottom: 8px;
}

main #uploadForm,
main section[aria-labelledby="documentsHeading"],
main section[aria-labelledby="qaHeading"] {
    min-width: 0;
    padding: 24px;
    border: 1px solid #334155;
    border-radius: 18px;
    background: rgba(11, 16, 32, 0.5);
}

main #uploadForm {
    grid-column: 1;
    grid-row: 3;
}

main section[aria-labelledby="documentsHeading"] {
    grid-column: 2;
    grid-row: 3 / span 2;
}

main #result {
    grid-column: 1;
    grid-row: 4;
    margin-top: 0 !important;
}

main section[aria-labelledby="qaHeading"] {
    grid-column: 1 / -1;
    grid-row: 6;
}

main .card-body > hr {
    display: none;
}

main #answerResult {
    overflow-wrap: anywhere;
}

@media (max-width: 767px) {
    main .card-body {
        grid-template-columns: minmax(0, 1fr);
    }

    main #uploadForm,
    main #result,
    main section[aria-labelledby="documentsHeading"],
    main section[aria-labelledby="qaHeading"] {
        grid-column: 1;
        grid-row: auto;
    }

    main #uploadForm,
    main section[aria-labelledby="documentsHeading"],
    main section[aria-labelledby="qaHeading"] {
        padding: 18px;
    }
}

</style>

</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-3">Smart RAG PDF QA</h1>

                        <p class="text-muted">
                            Upload a PDF document to begin processing.
                        </p>

                        <form id="uploadForm">
                            <label for="fileInput" class="form-label">
                                Select PDF document
                            </label>

                            <input
                                id="fileInput"
                                name="file"
                                type="file"
                                accept=".pdf,application/pdf"
                                class="form-control mb-3"
                                required
                            >

                            <div id="selectedFileName"
                                 class="form-text mb-3"
                                 role="status"
                                 aria-live="polite"
                                 style="overflow-wrap: anywhere;"></div>

                            <button
                                id="uploadButton"
                                type="submit"
                                class="btn btn-primary"
                            >
                                Upload PDF
                            </button>
                        </form>

                        <div
                            id="result"
                            class="mt-4"
                            role="status"
                            aria-live="polite"
                        ></div>


                        <hr class="my-4">

                        <section aria-labelledby="documentsHeading">
                            <h2 id="documentsHeading" class="h5">
                                My Documents
                            </h2>
                            <p class="text-muted">
                                Select a previously uploaded PDF to ask questions.
                            </p>
                            <label for="documentSelect" class="form-label">
                                Saved documents
                            </label>
                            <select id="documentSelect" class="form-select">
                                <option value="">Loading documents...</option>
                            </select>
                            <div id="documentStatus"
                                 class="form-text mt-2"
                                 role="status"
                                 aria-live="polite"></div>
                        </section>

                        <hr class="my-4">

                        <section aria-labelledby="qaHeading">
                            <h2 id="qaHeading" class="h5">
                                Ask your PDF
                            </h2>

                            <p class="text-muted">
                                Upload a document, then ask questions
                                about its contents.
                            </p>

                            <form id="askForm">
                                <label for="questionInput" class="form-label">
                                    Your question
                                </label>

                                <textarea
                                    id="questionInput"
                                    class="form-control mb-3"
                                    rows="3"
                                    placeholder="What are the main requirements?"
                                    required
                                    disabled
                                ></textarea>

                                <button
                                    id="askButton"
                                    type="submit"
                                    class="btn btn-success"
                                    disabled
                                >
                                    Ask Question
                                </button>
                            </form>

                            <div
                                id="answerResult"
                                class="mt-4"
                                role="status"
                                aria-live="polite"
                            ></div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById("uploadForm");
        const fileInput = document.getElementById("fileInput");
        const selectedFileName = document.getElementById("selectedFileName");

        fileInput.addEventListener("change", () => {
            const file = fileInput.files && fileInput.files[0];
            selectedFileName.textContent = file
                ? "Selected file: " + file.name
                : "";
        });
        const uploadButton = document.getElementById("uploadButton");
        const result = document.getElementById("result");

        const askForm = document.getElementById("askForm");
        const questionInput = document.getElementById("questionInput");
        const askButton = document.getElementById("askButton");
        const answerResult = document.getElementById("answerResult");

        let activeDocumentId = null;
        const documentSelect = document.getElementById("documentSelect");
        const documentStatus = document.getElementById("documentStatus");

        function activateDocument(documentId) {
            activeDocumentId = documentId;
            questionInput.disabled = documentId === null;
            askButton.disabled = documentId === null;
            answerResult.replaceChildren();
        }

        async function loadDocuments(preferredId = null) {
            documentSelect.disabled = true;
            documentStatus.textContent = "Loading saved documents...";

            try {
                const response = await fetch("/api/documents", {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("Documents API failed");
                }

                const data = await response.json();

                if (!Array.isArray(data.documents)) {
                    throw new Error("Invalid documents response");
                }

                documentSelect.replaceChildren();

                const placeholder = document.createElement("option");
                placeholder.value = "";
                placeholder.textContent = "Select a saved document";
                documentSelect.appendChild(placeholder);

                for (const document of data.documents) {
                    const option = window.document.createElement("option");
                    option.value = String(document.id);
                    option.disabled = !document.ready;
                    option.textContent =
                        document.filename +
                        " - " + document.pages + " pages" +
                        (document.ready ? " - Ready" : " - Not indexed");
                    option.title =
                        document.filename +
                        " | Document #" + document.id +
                        " | " + document.pages + " pages" +
                        " | " + document.chunk_count + " chunks";

                    documentSelect.appendChild(option);
                }

                const readyDocuments = data.documents.filter(
                    document => document.ready
                );

                const selected = readyDocuments.find(
                    document => document.id === preferredId
                );

                if (selected) {
                    documentSelect.value = String(selected.id);
                    activateDocument(selected.id);
                } else {
                    activateDocument(null);
                }

                documentStatus.textContent =
                    data.documents.length + " saved documents; " +
                    readyDocuments.length + " ready for questions.";

            } catch (error) {
                console.error("My Documents loading failed:", error);
                documentStatus.textContent =
                    "Unable to load saved documents: " + error.message;

                // Keep an already active document usable.
            } finally {
                documentSelect.disabled = false;
            }
        }

        documentSelect.addEventListener("change", () => {
            const value = documentSelect.value;
            const documentId = value ? Number(value) : null;

            activateDocument(
                Number.isInteger(documentId) && documentId > 0
                    ? documentId
                    : null
            );

            if (activeDocumentId !== null) {
                documentStatus.textContent =
                    "Document #" + activeDocumentId +
                    " selected. You can ask questions now.";
            }
        });

        loadDocuments();


        function showAnswerMessage(message, type) {
            answerResult.replaceChildren();

            const alert = document.createElement("div");
            alert.className = "alert alert-" + type;
            alert.textContent = message;

            answerResult.appendChild(alert);
        }

        function renderAnswer(data) {
            answerResult.replaceChildren();

            if (!Array.isArray(data.items) || data.items.length === 0) {
                showAnswerMessage(
                    "No sufficiently supported answer was found.",
                    "warning"
                );
                return;
            }

            const heading = document.createElement("h3");
            heading.className = "h6 mb-3";
            heading.textContent = "Answer with source citations";
            answerResult.appendChild(heading);

            const list = document.createElement("div");
            list.className = "list-group";

            for (const item of data.items) {
                const entry = document.createElement("div");
                entry.className = "list-group-item";

                const fact = document.createElement("p");
                fact.className = "mb-1";
                fact.textContent = item.fact;

                const citation = document.createElement("small");
                citation.className = "text-muted";
                citation.textContent =
                    "Source: " + item.source_id +
                    " | Page: " + item.page_number;

                entry.appendChild(fact);
                entry.appendChild(citation);
                list.appendChild(entry);
            }

            answerResult.appendChild(list);
        }

        askForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (activeDocumentId === null) {
                showAnswerMessage(
                    "Please upload a PDF first.",
                    "warning"
                );
                return;
            }

            const question = questionInput.value.trim();

            if (!question) {
                showAnswerMessage(
                    "Please enter a question.",
                    "warning"
                );
                return;
            }

            askButton.disabled = true;
            askButton.textContent = "Generating answer...";
            showAnswerMessage(
                "Searching the document and verifying citations...",
                "info"
            );

            try {
                const response = await fetch("/api/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        question: question,
                        document_id: activeDocumentId,
                        top_k: 3
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAnswerMessage(
                        data.error || "Unable to answer the question.",
                        "danger"
                    );
                    return;
                }

                renderAnswer(data);

            } catch (error) {
                showAnswerMessage(
                    "Connection failed. Please try again.",
                    "danger"
                );

            } finally {
                askButton.disabled = activeDocumentId === null;
                askButton.textContent = "Ask Question";
            }
        });

        function showMessage(message, type) {
            result.replaceChildren();

            const alert = document.createElement("div");
            alert.className = "alert alert-" + type;
            alert.textContent = message;

            result.appendChild(alert);
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const file = fileInput.files[0];

            if (!file) {
                showMessage("Please select a PDF file.", "warning");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            uploadButton.disabled = true;
            uploadButton.textContent = "Uploading...";
            showMessage("Processing your document...", "info");

            try {
                const response = await fetch("/api/upload", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage(
                        data.error || "Upload failed.",
                        "danger"
                    );
                    return;
                }

                showMessage(
                    "Upload successful! Document ID: " +
                    data.document_id +
                    " | Filename: " +
                    data.filename +
                    " | Pages: " +
                    data.pages,
                    "success"
                );

                activateDocument(data.document_id);
                await loadDocuments(data.document_id);
                questionInput.value = "";
                answerResult.replaceChildren();

                form.reset();

            } catch (error) {
                showMessage(
                    "Unable to complete the request. Please try again.",
                    "danger"
                );

            } finally {
                uploadButton.disabled = false;
                uploadButton.textContent = "Upload PDF";
            }
        });
    </script>
</body>
</html>
